name: CI

on:
  pull_request:
    branches: [develop, main]
  # Also run on direct pushes to the long-lived branches. Merges into develop
  # and main are not always made through a pull request, and until this was
  # added those pushes reached the shared branches — and, for main, the
  # deploy workflow — with no CI at all.
  #
  # Only develop and main are listed, so a push to a feature branch with an
  # open PR does not run this twice.
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # For a pull_request the key is the PR number; for a push there is no PR,
  # so it falls back to the ref. PR runs and push runs therefore land in
  # different groups and do not cancel each other.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      # Runs before install: it is plain Node with no dependencies, and a
      # contrast regression should fail fast rather than after a full build.
      - name: Check theme contrast (WCAG AA)
        run: npm run check:contrast

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build -- --configuration production

      - name: Type-check Cypress tests
        run: npx tsc -p cypress/tsconfig.json --noEmit

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

  login-smoke:
    name: Login form smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Poll readiness explicitly: the action's wait-on can fail immediately on
      # a closed socket while Angular is still starting, before its timeout.
      - name: Start application and wait for readiness
        run: |
          npm start -- --host 127.0.0.1 > /tmp/table-mimic-ui.log 2>&1 &
          echo $! > /tmp/table-mimic-ui.pid
          curl --fail --silent --show-error --retry 60 --retry-delay 2 \
            --retry-all-errors --retry-max-time 120 http://127.0.0.1:4200/ > /dev/null

      - name: Run Cypress browser tests
        uses: cypress-io/github-action@dace029018fcdf86e0df89a31bc3cfa5b32570d8 # v7.3.0
        with:
          install: false
          browser: chrome
          spec: cypress/e2e/*.cy.ts

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/table-mimic-ui.pid ]; then
            kill "$(cat /tmp/table-mimic-ui.pid)" || true
          fi

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-login-failure
          path: |
            cypress/screenshots
            cypress/videos
            /tmp/table-mimic-ui.log
          if-no-files-found: ignore
          retention-days: 7
