name: Cypress Login E2E

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-login-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  login-validation:
    name: Login form validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Run Cypress login validation
        uses: cypress-io/github-action@v7
        with:
          start: npm start -- --host 0.0.0.0
          wait-on: "http://127.0.0.1:4200"
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/login.cy.ts

      - name: Upload Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-login-failure
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
