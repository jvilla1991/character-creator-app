<div class="modal" style="border-color: var(--celestial);" (click)="$event.stopPropagation()"
  role="dialog" aria-modal="true" aria-labelledby="create-campaign-title"
  cdkTrapFocus cdkTrapFocusAutoCapture>
  <div class="modal-title" id="create-campaign-title" style="color: var(--celestial-2);">Open a New Campaign</div>

  <div class="field">
    <label for="campaign-name">Campaign Name <span aria-label="required">*</span></label>
    <input id="campaign-name" aria-required="true" [(ngModel)]="name" autocomplete="off" placeholder="The Ashfall Accord" autofocus>
  </div>

  <div class="field">
    <label>Setting</label>
    <input [(ngModel)]="setting" autocomplete="off" placeholder="where the tale unfolds">
  </div>

  <div class="field">
    <label>Banner Hue</label>
    <div class="class-picker" style="grid-template-columns: repeat(5, 1fr);">
      @for (c of tints; track c) {
        <button
          class="class-pick"
          [class.active]="tint === c"
          style="text-transform: capitalize;"
          (click)="tint = c"
        >{{ c }}</button>
      }
    </div>
  </div>

  <div class="field">
    <div class="field-heading"><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" [(ngModel)]="slotInventory" style="width: auto;">
      Use slot-based inventory (Darker Dungeons)
    </label>
      <app-context-help label="Use slot-based inventory (Darker Dungeons)" text="Players who join convert their inventory to bulk &amp; slots. Set at creation; can't be changed later."></app-context-help></div>
  </div>

  <div class="field">
    <div class="field-heading"><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" [(ngModel)]="survivalConditions" style="width: auto;">
      Use survival conditions (Darker Dungeons)
    </label>
      <app-context-help label="Use survival conditions (Darker Dungeons)" text="Characters track hunger, thirst &amp; fatigue; time of day worsens them. Set at creation; can't be changed later."></app-context-help></div>
  </div>

  <div class="field">
    <div class="field-heading"><label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" [(ngModel)]="strictComponents" style="width: auto;">
      Strict material components
    </label>
      <app-context-help label="Strict material components" text="Casting a spell with a costly material component requires that component in inventory. Set at creation; can't be changed later."></app-context-help></div>
  </div>

  <div class="field">
    <div class="field-heading"><label>Days of the week</label>
      <app-context-help label="Days of the week" text="Pick a preset or enter custom day names. With a defined week the clock auto-advances the weekday each new day and counts weeks when it wraps. Editable later from the dashboard."></app-context-help></div>
    <app-week-days-editor [value]="weekDays" (valueChange)="onWeekDaysChange($event)"></app-week-days-editor>
  </div>

  <div class="field">
    <div class="field-heading"><label>In-world start date</label>
      <app-context-help label="In-world start date" text="Free text — any calendar works. The clock starts at morning of this day; the DM advances time in session and updates the date when a new day begins. Leave blank to set it later."></app-context-help></div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
      <input [(ngModel)]="startDay" autocomplete="off" placeholder="Day · 3rd" maxlength="40">
      <input [(ngModel)]="startMonth" autocomplete="off" placeholder="Month · Hammer" maxlength="40">
      <input [(ngModel)]="startYear" autocomplete="off" placeholder="Year · 1492 DR" maxlength="40">
      @if (!weekDays?.length) {
        <input
          [(ngModel)]="startWeekday" autocomplete="off" placeholder="Weekday" maxlength="40">
      }
      @if (weekDays?.length) {
        <select [(ngModel)]="startWeekday" aria-label="Weekday">
          <option value="">Weekday…</option>
          @for (d of weekDays; track d) {
            <option [value]="d">{{ d }}</option>
          }
        </select>
      }
    </div>
  </div>

  <div class="modal-actions">
    <button class="btn" (click)="cancel()">Cancel</button>
    <button class="btn primary" style="flex: none;" (click)="submit()" [disabled]="!name.trim()">Inscribe</button>
  </div>
</div>
