<div class="modal-title">Create a Character</div>

<div class="field">
  <label for="hero-name">Character Name <span aria-label="required">*</span></label>
  <input id="hero-name" aria-required="true" [ngModel]="name()"
         (ngModelChange)="nameChange.emit($event)"
         autofocus
         (keydown.enter)="next.emit()"
         (keydown.escape)="cancel.emit()">
</div>

<div class="field">
  <label>Player</label>
  <input [value]="player()" disabled
         title="Your characters are listed under your username">
</div>
