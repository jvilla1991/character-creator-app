<!-- Fixed bottom-right on every screen, so the dice are always one reach away. -->
<button
  type="button"
  class="dice-fab"
  title="Roll dice (R)"
  aria-label="Roll dice"
  aria-keyshortcuts="R"
  (click)="open()">
  <!-- d20: hexagonal silhouette with the top face picked out. -->
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
       stroke="currentColor" stroke-width="1.3"
       stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
    <polygon points="12,1.6 21,6.8 21,17.2 12,22.4 3,17.2 3,6.8"/>
    <polygon points="12,6.2 17.4,15.4 6.6,15.4"/>
    <path d="M12 6.2 V1.6 M6.6 15.4 L3 17.2 M17.4 15.4 L21 17.2"/>
  </svg>
</button>
