<div class="panel">
  <div class="panel-header">
    <span class="panel-title">Ability Scores</span>
  </div>
  <div class="abilities">
    @for (row of rows(); track row) {
      <div
        class="ability"
        [class.prof]="row.isSaveProf"
        >
        <div class="ability-save">save</div>
        <div class="ability-name" [title]="row.label">{{ row.key }}</div>
        <div class="ability-mod">{{ row.mod | modifier }}</div>
        <!-- A character's score opens its breakdown for every viewer (the DM can
        add lines there). A follower's score stays a plain number the DM types. -->
        @if (breakdownEnabled()) {
          <div class="ability-score"><button type="button" class="breakdown-btn"
            [class.adjustable]="canAdjust()"
            [attr.aria-label]="scoreButtonLabel(row)"
            (click)="breakdownRequested.emit(row.key)"
          >{{ row.score }}</button></div>
        } @else {
          <div class="ability-score"><app-editable-number
            [value]="row.score" [editable]="editable()" [min]="1" [max]="30"
            [intercept]="true" (editRequested)="requestScore(row.key, row.score)"
            [label]="row.label + ' score'" (committed)="setScore(row.key, $event)"
          >{{ row.score }}</app-editable-number></div>
        }
      </div>
    }
  </div>
</div>
