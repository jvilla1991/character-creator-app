<app-modal [title]="'Edit ' + request.label" tone="celestial" (dismiss)="cancel()">

  <div class="field">
    <label for="dm-edit-value">{{ request.label | titlecase }}</label>
    <input id="dm-edit-value"
      type="number"
      [(ngModel)]="valueDraft"
      [min]="request.min"
      [max]="request.max"
      (ngModelChange)="onValueChange()"
      (keydown.enter)="save()"
      autofocus
    >
  </div>

  <div class="field">
    <label for="dm-edit-log">Log entry (leave blank for the automatic one)</label>
    <textarea id="dm-edit-log"
      rows="2"
      [(ngModel)]="descDraft"
      [maxLength]="descMaxLength"
      (ngModelChange)="onDescInput()"
      placeholder="What happened…"
    ></textarea>
  </div>

  <div class="modal-actions">
    <button class="btn" type="button" (click)="cancel()">Cancel</button>
    <button class="btn primary" type="button" [disabled]="!canSave" (click)="save()">Save</button>
  </div>
</app-modal>
